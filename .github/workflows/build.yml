name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git ffmpeg libsqlite3-dev sqlite3 bzip2 libbz2-dev \
          zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblldb-dev \
          libffi-dev libncurses5-dev libncursesw5-dev libreadline-dev libdb5.3-dev \
          p7zip-full unzip libtool autoconf automake cmake gettext pkg-config libltdl-dev zip

    - name: Install Cython & Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "cython==0.29.33" buildozer

    - name: Clean & Build APK
      run: |
        rm -rf .buildozer bin ~/.buildozer
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mikeybot-apk
        path: bin/*.apk
