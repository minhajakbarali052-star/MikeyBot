name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            p7zip-full \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ninja-build \
            ccache

      - name: Install Buildozer Toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install legacy-cgi
          python -m pip install "Cython==0.29.34"
          python -m pip install "git+https://github.com/kivy/buildozer.git"

      - name: Verify Python and Cython
        run: |
          python --version
          python3 --version
          cython --version
          buildozer --version

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p "$HOME/.android"
          mkdir -p "$HOME/.android/licenses"
          touch "$HOME/.android/repositories.cfg"

          printf '%s\n' \
            '8933bad161af4178b118591cbc368e6f' \
            'd56f5187479451eabf01fb78af6dfcb131a6481b' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            'd975f751698a77b6629ae7e7c7c8c5b6c0f8e8d4' \
            > "$HOME/.android/licenses/android-sdk-license"

      - name: Clean Build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build Android APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer -v android debug

      - name: Verify APK
        run: |
          echo "Generated APK files:"
          ls -lah bin/
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mikeybot-apk
          path: bin/*.apk
          if-no-files-found: error
