name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Permission fix before compilation
    - name: Fix Directory Permissions
      run: sudo chmod -R 777 $GITHUB_WORKSPACE

    # Run Buildozer inside official container
    - name: Build APK with Docker Container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/home/user/app \
          kivy/buildozer android debug

    # Crucial Fix: Re-claim ownership of bin/ folder so artifact step can read the APK
    - name: Fix Artifact Ownership Permissions
      if: always()
      run: sudo chown -R $USER:$USER .

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mikeybot-apk
        path: bin/*.apk
