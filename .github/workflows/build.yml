name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
          cache: 'pip'

      - name: Verify Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            libltdl-dev \
            libsqlite3-dev \
            sqlite3 \
            ffmpeg

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34"
          python -m pip install buildozer

      - name: Verify Buildozer
        run: |
          buildozer --version
          python -m pip show buildozer
          python -m pip show cython

      - name: Clean All Build Caches
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf ~/.buildozer

      - name: Build APK
        env:
          P4A_RELEASE_URL: https://github.com/kivy/python-for-android.git
        run: |
          buildozer android clean
          buildozer -v android debug

      - name: Check APK
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikeybot-apk
          path: bin/*.apk
          if-no-files-found: error
